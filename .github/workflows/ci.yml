name: CI

# Until this existed the repo's only workflow was the CLA check, so every "the
# tests pass" claim on a PR was one contributor's machine — in practice always
# macOS/arm64. Platform-specific failures (a syscall Linux enforces and macOS
# does not, path or case sensitivity, timing) had no way of being caught before
# merge. Hence the two-OS matrix rather than ubuntu alone.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR makes the older run's answer irrelevant, so PRs
  # share a group per ref. Pushes to main get a group per COMMIT instead, so they
  # never cancel each other: cancel-in-progress only governs the run that is
  # already running, while a previously PENDING run in the same group is
  # cancelled whenever a newer one queues, regardless of that setting. Sharing a
  # group on main would therefore leave the middle commit of three rapid pushes
  # with no ci-ok result at all -- not red, simply absent, which is harder to
  # notice than a failure.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  # Only on PRs. `ci-ok` runs under `if: always()`, so a cancelled run still
  # executes it and fails (needs.test.result is "cancelled", not "success") --
  # it reports RED, not cancelled. On a PR that red hangs off a superseded SHA
  # and is harmless; on main it would be a permanent red on a real commit.
  # Redundant with the per-commit group above, and kept anyway: either one alone
  # would stop main from cancelling itself, and stating the intent is worth more
  # than the duplication costs. `!cancelled()` is NOT the fix -- it reopens the
  # skipped-counts-as-passing hole above.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      # Do not cancel the other OS when one fails: when a failure IS the
      # platform difference, the comparison is the whole point.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/nak is a submodule that no package imports (see README);
          # leaving it unfetched keeps CI honest about what actually builds.
          submodules: false
          # checkout otherwise leaves a basic-auth header for GITHUB_TOKEN in
          # .git/config inside the workspace, where the PR-controlled code that
          # `go test` runs three steps later can read it. Nothing here uses git
          # auth after checkout, so there is no reason to leave it lying around.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          # gofmt's exit code and its stdout have to be handled separately.
          # `gofmt -l` exits 0 whether or not it lists anything, so an unformatted
          # file only fails the job if the list is turned into an exit code
          # explicitly. But gofmt ALSO exits non-zero on a file it cannot parse,
          # writing the error to stderr and listing nothing on stdout -- so the
          # obvious `$(gofmt -l . | grep -v ... || true)` reports "clean" for a
          # syntactically broken file. `|| true` is needed for grep (which exits 1
          # when it filters everything out) but it must not be allowed to swallow
          # gofmt's own failure. Hence the two checks before the list is examined.
          err="$(mktemp)"
          if ! files="$(gofmt -l . 2>"$err")"; then
            echo "gofmt failed to run:" >&2
            cat "$err" >&2
            exit 1
          fi
          if [ -s "$err" ]; then
            echo "gofmt reported errors (a file it could not parse?):" >&2
            cat "$err" >&2
            exit 1
          fi
          unformatted="$(printf '%s\n' "$files" \
            | grep -v '^third_party/' \
            | grep -v '^build/' \
            | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            echo >&2
            echo "Run: gofmt -w $(echo "$unformatted" | tr '\n' ' ')" >&2
            exit 1
          fi
          echo "gofmt clean"

      - name: Test
        # -race because the defects this repo keeps hitting are concurrent ones
        # (concurrent keystore/outbox writes, the daemon racing the sender).
        # -count=1 because a cached "ok" from a previous run proves nothing
        # about this commit.
        run: go test ./... -race -count=1

  # A stable name for branch protection to require.
  #
  # The matrix legs surface as "test (ubuntu-latest)" and "test (macos-latest)",
  # so a rule requiring "test" or "CI" matches no check that is ever reported.
  # GitHub then holds the PR at "Waiting for status to be reported" forever: it
  # blocks merging rather than letting anything through, so the symptom is "this
  # PR cannot be merged", NOT "the gate did not fire". Worth stating precisely,
  # because someone debugging the wrong one of those looks in the wrong place.
  # Requiring this job instead survives future changes to the matrix.
  #
  # `if: always()` is load-bearing: without it, a failing `test` makes this job
  # SKIPPED rather than failed, and GitHub counts a required check as satisfied
  # when it has a successful, skipped or neutral status. That would turn the
  # gate into the exact thing it exists to prevent.
  #
  # `needs: [test]` automatically covers future legs OF `test` (adding windows
  # needs no change here) but NOT future jobs -- a new top-level job must be
  # added to this list or it is not gated.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have succeeded
        run: |
          echo "test result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
